<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#0b2230"/>
      <stop offset="60%" stop-color="#050b12"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7dedff"/>
      <stop offset="55%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <radialGradient id="iris" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#d9fbff"/>
      <stop offset="45%" stop-color="#38e8ff"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </radialGradient>
    <clipPath id="globe">
      <circle cx="256" cy="248" r="172"/>
    </clipPath>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bg)"/>

  <!-- HUD corner brackets -->
  <g stroke="#155e6b" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M64 128V88a24 24 0 0 1 24-24h40"/>
    <path d="M448 128V88a24 24 0 0 0-24-24h-40"/>
    <path d="M64 384v40a24 24 0 0 0 24 24h40"/>
    <path d="M448 384v40a24 24 0 0 1-24 24h-40"/>
  </g>

  <!-- globe -->
  <g filter="url(#glow)">
    <circle cx="256" cy="248" r="172" fill="#031018" stroke="url(#rim)" stroke-width="5"/>
  </g>

  <g clip-path="url(#globe)" stroke="#1a7f92" stroke-width="2" fill="none" opacity="0.75">
    <ellipse cx="256" cy="248" rx="172" ry="70"/>
    <ellipse cx="256" cy="248" rx="172" ry="128"/>
    <ellipse cx="256" cy="248" rx="70" ry="172"/>
    <ellipse cx="256" cy="248" rx="128" ry="172"/>
    <line x1="84" y1="248" x2="428" y2="248"/>
    <line x1="256" y1="76" x2="256" y2="420"/>
  </g>

  <!-- orbit ring -->
  <ellipse cx="256" cy="248" rx="212" ry="74" fill="none" stroke="#f0a63c" stroke-width="3" opacity="0.55" transform="rotate(-18 256 248)"/>

  <!-- eye / reticle -->
  <g filter="url(#glow)">
    <path d="M144 248c30-52 72-78 112-78s82 26 112 78c-30 52-72 78-112 78s-82-26-112-78z"
          fill="#02090f" stroke="#4be3ff" stroke-width="4" opacity="0.95"/>
    <circle cx="256" cy="248" r="46" fill="url(#iris)"/>
    <circle cx="256" cy="248" r="20" fill="#03151d"/>
    <circle cx="273" cy="231" r="7" fill="#eafdff"/>
  </g>

  <!-- reticle ticks -->
  <g stroke="#9af3ff" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <path d="M256 120v30"/>
    <path d="M256 346v30"/>
    <path d="M128 248h30"/>
    <path d="M354 248h30"/>
  </g>

  <!-- contacts -->
  <g fill="#f0a63c">
    <circle cx="146" cy="148" r="5"/>
    <circle cx="386" cy="330" r="5"/>
    <circle cx="392" cy="156" r="4"/>
  </g>
</svg>
